# 用 GitHub Actions 部署静态站点到 GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]   # 仅 main 分支推送时部署
  workflow_dispatch:      # 手动触发

# 部署到 Pages 需要的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 保证同一时间只有一次生产部署在跑
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 如果需要构建，请取消注释并按项目类型调整
      # - name: Setup Node
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      #     cache: 'npm'
      # - name: Install deps
      #   run: npm ci
      # - name: Build
      #   run: npm run build   # 产物假设输出到 dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 仅上传构建产物目录，避免把整个仓库暴露到站点
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
